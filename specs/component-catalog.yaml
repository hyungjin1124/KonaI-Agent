        description: "사용자/AI 메시지를 구분하여 표시하는 채팅 버블"
        status: implemented
        priority: critical
        complexity: simple
        contexts: [chat_view]
        source_files:
          - "src/components/features/general-chat/components/ChatPanel/ChatPanel.tsx"
          - "src/components/ChatHistoryView.tsx"
        notes: "현재 기본적인 버블은 구현됨. 복사 버튼, 메시지 액션 메뉴 등 추가 필요."

      - id: markdown_renderer
        name: "Markdown Renderer"
        description: "에이전트 응답의 마크다운을 렌더링 (코드블록, 테이블, 수식, 다이어그램)"
        status: not_implemented
        priority: critical
        complexity: moderate
        contexts: [chat_view, artifact_panel]
        source_files: []
        obsidian_sources:
          - "Insights/agent-ui/patterns/streaming-response-rendering.md"
        dependencies: []

      - id: streaming_typing
        name: "Streaming Typing Animation"
        description: "에이전트 응답이 실시간으로 타이핑되듯 표시되는 스트리밍 효과"
        status: not_implemented
        priority: critical
        complexity: moderate
        contexts: [chat_view]
        source_files: []
        obsidian_sources:
          - "Insights/agent-ui/patterns/streaming-response-rendering.md"
        dependencies: [markdown_renderer]

      - id: chat_input
        name: "Chat Input (Multi-modal)"
        description: "텍스트, 파일, 이미지 등 멀티모달 입력을 지원하는 채팅 입력창"
        status: partial
        priority: high
        complexity: moderate
        contexts: [chat_view]
        source_files:
          - "src/components/ChatInterface.tsx"
          - "src/components/features/general-chat/GeneralChatView.tsx"
        obsidian_sources:
          - "Insights/agent-ui/patterns/multimodal-input-patterns.md"
        notes: "기본 textarea는 구현됨. 파일 첨부, 이미지, 음성 등 멀티모달 확장 필요."

      - id: code_block
        name: "Code Block"
        description: "구문 강조, 복사, 실행 기능이 있는 코드 블록"
        status: not_implemented
        priority: high
        complexity: moderate
        contexts: [chat_view, artifact_panel]
        source_files: []
        obsidian_sources:
          - "Insights/agent-ui/patterns/message-interaction-patterns.md"
        dependencies: [markdown_renderer]

      - id: message_actions
        name: "Message Actions"
        description: "메시지별 액션 메뉴 (복사, 재생성, 피드백, 공유)"
        status: not_implemented
        priority: high
        complexity: simple
        contexts: [chat_view]
        source_files: []
        obsidian_sources:
          - "Insights/agent-ui/patterns/message-interaction-patterns.md"

      - id: message_edit_regenerate
        name: "Message Edit & Regenerate"
        description: "사용자 메시지 수정 및 응답 재생성, 대화 분기"
        status: not_implemented
        priority: medium
        complexity: moderate
        contexts: [chat_view]
        source_files: []
        obsidian_sources:
          - "Insights/agent-ui/patterns/message-interaction-patterns.md"

      - id: citation_source_link
        name: "Citation & Source Link"
        description: "에이전트 응답에 출처 인용 및 링크 표시"
        status: not_implemented
        priority: medium
        complexity: simple
        contexts: [chat_view]
        source_files: []

      - id: suggested_prompts
        name: "Suggested Prompts / Starter Questions"
        description: "대화 시작 시 추천 질문 또는 컨텍스트 기반 후속 질문"
        status: not_implemented
        priority: medium
        complexity: simple
