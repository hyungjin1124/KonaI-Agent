        priority: high
        complexity: complex
        contexts: [chat_view, artifact_panel]
        source_files: []
        obsidian_sources:
          - "Insights/agent-ui/patterns/diff-review-patterns.md"

      - id: feedback_collection
        name: "Feedback Collection"
        description: "에이전트 응답에 대한 사용자 피드백 수집 (좋아요/싫어요, 코멘트)"
        status: not_implemented
        priority: medium
        complexity: simple
        contexts: [chat_view]
        source_files: []

      - id: confirmation_dialog
        name: "Confirmation Dialog"
        description: "위험한 작업 전 사용자 확인을 받는 다이얼로그"
        status: partial
        priority: medium
        complexity: simple
        contexts: [chat_view, admin]
        source_files:
          - "src/components/ui/dialog.tsx"
        obsidian_sources:
