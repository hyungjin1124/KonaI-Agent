# ============================================================================
# 카탈로그 업데이트 가이드
# ============================================================================
#
# 이 카탈로그는 3개 커맨드 파이프라인에 의해 업데이트됩니다:
#   /discover → /research → /implement
#
# --- /discover (외부 동향 스캔) ---
#   - NEW: 새 컴포넌트 항목 추가 (status: research_needed)
#   - PRIORITY_CHANGE: priority 조정
#   - DEPRECATED: status → deprecated 제안
#   - 직접 카탈로그를 수정하지 않고 리포트로 제안
#
# --- /research (리서치 브리프 생성) ---
#   - obsidian_sources 추가/갱신
#   - last_researched 갱신 (오늘 날짜)
#   - 새 주제면 새 컴포넌트 항목 추가
#   - 기존 implemented인데 개선 필요하면 status → needs_update
#
# --- /implement (코드 구현) ---
#   - status → implemented | partial
#   - source_files 추가
#   - metadata.last_updated 갱신
#
# --- 수동 업데이트 가이드 ---
# 새로운 패턴 추가 시:
#   1. 적절한 카테고리 선택 (없으면 새 카테고리 추가)
#   2. 고유 id 부여 (snake_case)
#   3. status를 research_needed로 설정
#   4. obsidian_sources에 관련 리서치 문서 경로 추가
#   5. last_researched에 리서치 수행일 기록
#   6. metadata.last_updated 갱신
