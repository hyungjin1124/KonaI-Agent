        notes: "multi_agent_orchestration_ui에 포괄되는 하위 개념. 함께 구현 권장. Cursor Cloud Agents with Computer Use (Feb 24): 내부 PR 35% 자율 에이전트 생성, 브라우저 UI 테스트. Cursor Automations (Mar 5): always-on 에이전트, 이벤트 트리거. OpenAI Codex App Windows (Mar 4): 네이티브 Windows 샌드박스, isolated worktree, editable diffs. 3대 코딩 AI(Cursor 2.5, Copilot CLI, Codex App) 공통 병렬 에이전트 UI 채택. OpenAI Codex App Windows (Mar 4): 병렬 에이전트 isolated worktree + editable diff 패턴. 3대 코딩 AI(Cursor 2.5, Copilot CLI, Codex App) 공통 채택."

      - id: multi_agent_orchestration_ui
        name: "Multi-Agent Orchestration UI"
        description: "복수 에이전트의 협업, 위임, 병렬 실행을 시각화하는 오케스트레이션 인터페이스"
