# ============================================================================
# KonaI-Agent UI Component Catalog
# ============================================================================
# 이 카탈로그는 에이전트가 코드베이스를 스캔하여 gap analysis를 수행하기 위한
# 마스터 참조 문서입니다. 리서치를 통해 발견된 새로운 패턴을 지속적으로 추가합니다.
#
# 역할 분리:
#   - 이 카탈로그: 상태 추적 + 코드 매핑 (status, priority, source_files, obsidian_sources)
#   - Obsidian Vault: 리서치 + 기준 정의 (경쟁사 분석, acceptance criteria, references)
#   → obsidian_sources 필드를 통해 상세 리서치 문서에 접근 가능
#
# status: implemented | partial | not_implemented | research_needed | needs_update | deprecated
#   - needs_update: 구현 완료이나 리서치에서 개선 필요성 발견
#   - deprecated: 더 이상 필요 없음 (다른 패턴으로 대체됨)
# priority: critical | high | medium | low
# complexity: simple(1-2일) | moderate(3-5일) | complex(1주+) | epic(분리필요)
# last_researched: YYYY-MM-DD (마지막 리서치 수행일, /research 커맨드가 갱신, 30일 경과 시 stale 후보)

metadata:
  version: "1.2.0"
  last_updated: "2026-02-21"
  project: "KonaI-Agent"
  tech_stack:
    framework: "Next.js 15"
    ui: "React 18, Tailwind CSS, Radix UI"
    visualization: "Recharts, react-grid-layout, ReactFlow"
    state: "React Context"
  scan_paths:
    components: "src/components"
    pages: "src/app"
    hooks: "src/hooks"
    types: "src/types"

contexts:
  - id: chat_view
    name: "Chat View"
    description: "메인 대화 인터페이스 (일반 채팅 + 에이전트 채팅)"
    routes: ["/", "/chat"]
  - id: artifact_panel
    name: "Artifact Panel"
    description: "에이전트가 생성한 결과물을 표시하는 패널"
    routes: ["/chat"]
  - id: liveboard
    name: "Liveboard / Dashboard"
    description: "위젯 기반 대시보드 및 시각화"
    routes: ["/", "/liveboard"]
  - id: admin
    name: "Admin Dashboard"
    description: "사용자 관리, 권한, 시스템 설정"
    routes: ["/admin", "/settings"]
  - id: monitoring
    name: "Monitoring & Ops"
    description: "에이전트 모니터링, 감사 로그, 사용량"
    routes: []
  - id: data_pipeline
    name: "Data Pipeline"
    description: "데이터 파이프라인 시각화 및 관리"
    routes: ["/data"]
  - id: agent_scenario
    name: "Agent Scenario"
    description: "PPT 생성, 분석 등 멀티스텝 에이전트 시나리오"
    routes: ["/agent/ppt", "/agent/analysis"]
  - id: global
    name: "Global"
    description: "모든 화면에서 공통으로 사용되는 패턴"
    routes: ["*"]

categories:
  # ============================================================================
  # 카테고리 1: Conversational Primitives
