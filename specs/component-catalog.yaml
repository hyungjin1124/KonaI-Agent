        notes: "Phase 1 구현 완료. SelfReviewCard(접이식 검증 카드) + SelfReviewCheckItem(항목별 pass/warning/fail 표시) + deriveRiskLevel(ApprovalGate 연동용 동적 리스크 매핑). 19개 테스트 PASS. Phase 2: 시나리오 훅 통합 + 도메인별 검증 규칙."
